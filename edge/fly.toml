# Your public front door on Fly: your address → webhooks → Bops on your Mac (over your tailnet).
# Set app to your own Fly app's name (fly launch --no-deploy makes one).
app = "your-bops-front-door"
primary_region = "sjc"

[env]
  PORT = "8080"

# Tailscale's login, so restarts and deploys don't need approving again.
[[mounts]]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: webhooks and calls can come at any time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
